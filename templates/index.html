<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos | Pymedesk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main><header><div><small>PYMEDESK</small><h1>Gestión de pedidos</h1><p>Consulta y actualiza el estado de los pedidos.</p></div><span id="count"></span></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section><div class="scroll"><table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="orders"><tr><td colspan="5">Cargando pedidos…</td></tr></tbody></table></div></section></main>
<script>
const body = document.querySelector("#orders");
const count = document.querySelector("#count");
const notice = document.querySelector("#notice");
let noticeTimer;
function showNotice(message, type) {
  clearTimeout(noticeTimer);
  notice.textContent = message;
  notice.className = type;
  notice.hidden = false;
  if (type === "success") noticeTimer = setTimeout(() => { notice.hidden = true; }, 4000);
}
const money = new Intl.NumberFormat("es-CO", {style:"currency",currency:"COP",maximumFractionDigits:0});
async function loadOrders() {
  try {
    const response = await fetch("/api/orders");
    if (!response.ok) throw new Error();
    const orders = await response.json();
    count.textContent = orders.length + " pedidos";
    body.replaceChildren();
    for (const order of orders) {
      const row = document.createElement("tr");
      for (const value of [order.id, order.customer, money.format(order.total)]) {
        const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
      }
      const status = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + order.status; badge.textContent = order.status;
      status.append(badge); row.append(status);
      const action = document.createElement("td");
      const button = document.createElement("button");
      // Solo los pendientes se pueden enviar; el servidor valida igualmente.
      button.disabled = order.status !== "pendiente";
      button.textContent = {enviado: "Ya enviado", cancelado: "No disponible"}[order.status] || "Marcar como enviado";
      if (order.status === "cancelado") button.title = "Los pedidos cancelados no se pueden enviar";
      button.onclick = () => ship(order.id, button);
      action.append(button); row.append(action); body.append(row);
    }
  } catch {
    count.textContent = "";
    body.innerHTML = '<tr><td colspan="5">No se pudieron cargar los pedidos. Recarga la página.</td></tr>';
  }
}
async function ship(id, button) {
  button.disabled = true;
  button.textContent = "Enviando…";
  let response;
  try {
    response = await fetch(`/api/orders/${id}/ship`, {method:"POST"});
  } catch {
    showNotice("No hay conexión con el servidor. Revisa tu conexión e inténtalo de nuevo.", "error");
    button.disabled = false;
    button.textContent = "Marcar como enviado";
    return;
  }
  if (response.ok) {
    showNotice(`Pedido #${id} marcado como enviado.`, "success");
  } else {
    const data = await response.json().catch(() => ({}));
    showNotice(`No se pudo enviar el pedido #${id}: ${data.error || "error inesperado del servidor."}`, "error");
  }
  await loadOrders();
}
loadOrders();
</script>
</body></html>
