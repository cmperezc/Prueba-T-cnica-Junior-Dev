name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  id-token: write # OIDC: credenciales temporales de AWS, sin llaves guardadas
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-1
      SITE_URL: https://pymedesk.varitia.com
    steps:
      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servidor (SSM Run Command)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["sudo -u ubuntu git -C /opt/pymedesk pull --ff-only","bash /opt/pymedesk/deploy/update.sh"]' \
            --query Command.CommandId --output text)
          echo "Comando SSM: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$STATUS" = "Success"

      - name: Verificar sitio
        run: |
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" "$SITE_URL/"
          curl -fsS -o /dev/null -w "GET /api/orders -> %{http_code}\n" "$SITE_URL/api/orders"
